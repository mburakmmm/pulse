name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: pulse-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NOX_VERSION: v2.2.70
  NOX_COMMIT: 4dc061f8c8443f8575092c2652d1109b6f4697e9
  NOX_REPOSITORY: mburakmmm/nox-lang
  PROMETHEUS_VERSION: 3.16.0
  PROMETHEUS_LINUX_AMD64_SHA256: 68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34

jobs:
  core:
    name: Core / ${{ matrix.label }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: macos-arm64
            archive: tar.gz
            label: macOS ARM64
          - os: ubuntu-latest
            asset: linux-x64
            archive: tar.gz
            label: Linux x64
          - os: ubuntu-24.04-arm
            asset: linux-arm64
            archive: tar.gz
            label: Linux ARM64
          - os: windows-2025
            asset: windows-x64
            archive: zip
            label: Windows x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install checksum-verified NOX release (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          stage="nox-lang-${NOX_VERSION}-${{ matrix.asset }}"
          base="https://github.com/${NOX_REPOSITORY}/releases/download/${NOX_VERSION}"
          curl --fail --silent --show-error --location --remote-name "${base}/${stage}.tar.gz"
          curl --fail --silent --show-error --location --remote-name "${base}/${stage}.tar.gz.sha256"
          shasum -a 256 -c "${stage}.tar.gz.sha256"
          tar xzf "${stage}.tar.gz"
          echo "$PWD/${stage}/bin" >>"$GITHUB_PATH"
          echo "NOX_RESOURCE_DIR=$PWD/${stage}" >>"$GITHUB_ENV"

      - name: Install checksum-verified NOX release (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "nox-lang-$env:NOX_VERSION-${{ matrix.asset }}"
          $base = "https://github.com/$env:NOX_REPOSITORY/releases/download/$env:NOX_VERSION"
          Invoke-WebRequest -Uri "$base/$stage.zip" -OutFile "$stage.zip"
          Invoke-WebRequest -Uri "$base/$stage.zip.sha256" -OutFile "$stage.zip.sha256"
          $expected = (Get-Content "$stage.zip.sha256" -Raw).Trim().Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "NOX archive checksum mismatch: expected $expected, got $actual"
          }
          Expand-Archive -Path "$stage.zip" -DestinationPath .
          "$($PWD.Path)\$stage\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "NOX_RESOURCE_DIR=$($PWD.Path)\$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify toolchain pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(noxc --version 2>&1)" = "noxc ${NOX_VERSION#v}"
          noxc version --build-info | grep -Fx "commit: ${NOX_COMMIT}"

      - name: Verify NOX formatting
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source_file; do
            noxc fmt "$source_file"
          done < <(git ls-files -z '*.nox')
          if ! git diff --quiet -- '*.nox'; then
            git diff --check -- '*.nox'
            git diff -- '*.nox'
            exit 1
          fi

      - name: Run portable QBE and LLVM suite
        shell: bash
        run: bash scripts/run-ci-core.sh

      - name: Record scope limits
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.label }}"
            echo
            echo "- Portable core: QBE + LLVM"
            echo "- Metrics providers: single-owner and opt-in bounded shared recording"
            echo "- Concurrent reader/exporter instances: unsupported; keep them caller-owned"
          } >>"$GITHUB_STEP_SUMMARY"

  capability:
    name: Capabilities / ${{ matrix.label }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: macos-arm64
            label: macOS ARM64
          - os: ubuntu-latest
            asset: linux-x64
            label: Linux x64
          - os: ubuntu-24.04-arm
            asset: linux-arm64
            label: Linux ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install checksum-verified NOX release
        shell: bash
        run: |
          set -euo pipefail
          stage="nox-lang-${NOX_VERSION}-${{ matrix.asset }}"
          base="https://github.com/${NOX_REPOSITORY}/releases/download/${NOX_VERSION}"
          curl --fail --silent --show-error --location --remote-name "${base}/${stage}.tar.gz"
          curl --fail --silent --show-error --location --remote-name "${base}/${stage}.tar.gz.sha256"
          shasum -a 256 -c "${stage}.tar.gz.sha256"
          tar xzf "${stage}.tar.gz"
          echo "$PWD/${stage}/bin" >>"$GITHUB_PATH"
          echo "NOX_RESOURCE_DIR=$PWD/${stage}" >>"$GITHUB_ENV"

      - name: Verify toolchain pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(noxc --version 2>&1)" = "noxc ${NOX_VERSION#v}"
          noxc version --build-info | grep -Fx "commit: ${NOX_COMMIT}"

      - name: Runtime divergence audit
        shell: bash
        run: |
          bash scripts/run-runtime-capability-audit.sh llvm
          bash scripts/run-runtime-capability-audit.sh qbe

      - name: Type and compiler limitation audit
        shell: bash
        run: bash scripts/run-type-capability-audit.sh

      - name: HTTP and TLS capability audit
        shell: bash
        run: |
          bash scripts/run-http-capability-audit.sh llvm
          bash scripts/run-http-capability-audit.sh qbe

      - name: Backend transfer audit
        shell: bash
        run: bash scripts/run-backend-transfer-audit.sh

      - name: Record capability scope
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.label }} capability audit"
            echo
            echo "- Runtime and HTTP behavior: executed on QBE + LLVM"
            echo "- Class and TaskLocal transfer regressions: executed per backend"
            echo "- OTLP Collector: SKIPPED; OTLP exporters are not implemented"
            echo "- Prometheus parser: executed by the dedicated Linux x64 conformance job"
          } >>"$GITHUB_STEP_SUMMARY"

  prometheus_conformance:
    name: Prometheus conformance / Linux x64
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install checksum-verified promtool
        shell: bash
        run: |
          set -euo pipefail
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          curl --fail --silent --show-error --location --output "$archive" "${base}/${archive}"
          printf '%s  %s\n' "$PROMETHEUS_LINUX_AMD64_SHA256" "$archive" | shasum -a 256 -c -
          tar xzf "$archive"
          echo "PROMTOOL=$PWD/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" >>"$GITHUB_ENV"

      - name: Install checksum-verified NOX release
        shell: bash
        run: |
          set -euo pipefail
          stage="nox-lang-${NOX_VERSION}-linux-x64"
          base="https://github.com/${NOX_REPOSITORY}/releases/download/${NOX_VERSION}"
          curl --fail --silent --show-error --location --remote-name "${base}/${stage}.tar.gz"
          curl --fail --silent --show-error --location --remote-name "${base}/${stage}.tar.gz.sha256"
          shasum -a 256 -c "${stage}.tar.gz.sha256"
          tar xzf "${stage}.tar.gz"
          echo "$PWD/${stage}/bin" >>"$GITHUB_PATH"
          echo "NOX_RESOURCE_DIR=$PWD/${stage}" >>"$GITHUB_ENV"

      - name: Verify NOX toolchain pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(noxc --version 2>&1)" = "noxc ${NOX_VERSION#v}"
          noxc version --build-info | grep -Fx "commit: ${NOX_COMMIT}"

      - name: Validate text exposition with promtool
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-prometheus-conformance.sh
          bash scripts/run-prometheus-scrape-integration.sh llvm
          bash scripts/run-prometheus-scrape-integration.sh qbe

      - name: Record conformance scope
        if: always()
        shell: bash
        run: |
          {
            echo "### Prometheus conformance"
            echo
            echo "- Parser: checksum-verified promtool ${PROMETHEUS_VERSION}"
            echo "- Text exposition 0.0.4 golden fixture: executed"
            echo "- Real HTTP scrape response parsed on QBE + LLVM: executed"
            echo "- Listener ownership/bind exposure: application decision; Pulse supplies a pure handler adapter"
          } >>"$GITHUB_STEP_SUMMARY"

  ci-success:
    name: CI success
    if: always()
    needs:
      - core
      - capability
      - prometheus_conformance
    runs-on: ubuntu-latest
    steps:
      - name: Require every claimed gate
        shell: bash
        env:
          CORE_RESULT: ${{ needs.core.result }}
          CAPABILITY_RESULT: ${{ needs.capability.result }}
          PROMETHEUS_RESULT: ${{ needs.prometheus_conformance.result }}
        run: |
          set -euo pipefail
          test "$CORE_RESULT" = "success"
          test "$CAPABILITY_RESULT" = "success"
          test "$PROMETHEUS_RESULT" = "success"
